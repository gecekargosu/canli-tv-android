// UMAY Multi TV - Gradle modulu (reklam SDK'si icin).
// Kaynaklar kok dizinde duruyor (src/, res/, assets/, AndroidManifest.xml); build.sh
// ile ayni dosyalar kullanilir. Manifest'in "package" ozniteligi Gradle 8'de yasak,
// bu yuzden gradle-build.sh once _build/gradle/AndroidManifest.xml kopyasini uretir.
plugins {
    id 'com.android.application'
}

// Imza sifresi repoda durmasin: kok dizindeki keystore.properties (git'e girmez) ya da
// UMAY_STOREPASSWORD / UMAY_KEYPASSWORD ortam degiskeni okunur.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ks = { String k ->
    ksProps.getProperty(k) ?: (System.getenv('UMAY_' + k.replaceAll('([A-Z])', '_$1').toUpperCase()) ?: '')
}

android {
    namespace 'com.cengiz.canlitv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cengiz.canlitv'
        minSdk 26
        targetSdk 36
        versionCode 97
        versionName '9.88'
    }

    signingConfigs {
        // build.sh ile ayni debug anahtari: adb install -r mevcut kurulumun uzerine yazar
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('../upload-keystore.jks')
            // Sifre depoda acik yazilmasin: keystore.properties (git'e girmez) veya ortam degiskeni
            storePassword ks('storePassword')
            keyAlias 'upload'
            keyPassword ks('keyPassword')
        }
    }

    // M-06: siteden dağıtılan APK ile Play AAB aynı imzayı kullansın.
    // Üretim anahtarı yoksa (ör. temiz makine) derleme kırılmasın diye debug'a düşer.
    def hasUploadKey = file('../upload-keystore.jks').exists()

    buildTypes {
        debug {
            // test reklamlari Ads.java icinde (BuildConfig.DEBUG) secilir
            signingConfig signingConfigs.debug
        }
        release {
            // K-15: R8 + kaynak küçültme. Keep kuralları: app/proguard-rules.pro
            // (Billing, AdMob/UMP, Media3 yansıma kullanıyor).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        // Halka acik APK: gercek reklam kimlikleri ve ÜRETİM imzası (Play ile aynı anahtar).
        // Not: v9.32 ve öncesi debug anahtarıyla imzalıydı; bu sürümden itibaren aynı
        // anahtarla imzalanır, eski kurulumların bir kez kaldırılıp yeniden kurulması gerekir.
        publicApk {
            initWith release
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile '../_build/gradle/AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    // P0-3: AB/UK rıza ekranı (UMP)
    implementation 'com.google.android.ump:user-messaging-platform:3.0.1'
    // #107: MediaPlayer yerine ExoPlayer (media3) — HLS + otomatik kalite
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // 9.82: reklamsız abonelik (Google Play Faturalandırma)
    implementation 'com.android.billingclient:billing:6.2.1'
}
